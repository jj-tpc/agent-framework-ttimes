      - id: proxy
        type: custom
        parentId: perm_block
        position:
          x: 680
          'y': 230
        data:
          type: code
          title: 자격증명 프록시 · 실행
          desc: 비밀값은 여기서만 붙는다
          code_language: javascript
          variables:
            - variable: allowed
              value_selector:
                - perm_check
                - allowed
            - variable: token
              value_selector:
                - env
                - service_token
            - variable: turn_events
              value_selector:
                - inbox_norm
                - events
          code: >-
            // 모델은 비밀값 없이 "무엇을 하고 싶은지"만 말한다. 실제 요청에 자격증명을 붙이는 일은 에이전트 바깥의 프록시가
            한다.

            // 그래서 프롬프트에도, 도구 결과에도, 메모리에도 토큰이 남지 않는다. (데모: 외부 서비스 대신 가짜 응답을
            돌려준다)

            function main({ allowed, token }) {
              const auth = token ? "Bearer " + token.slice(0, 4) + "…(가림)" : "(토큰 없음)";
              const results = [];
              const new_timers = [];
              for (const c of allowed || []) {
                const input = c.input || {};
                if (c.name === "read_calendar") results.push({ tool: "일정 조회", ok: true, output: "10:00 주간 회의 · 14:00 거래처 미팅 · 17:30 치과", auth });
                else if (c.name === "send_email") results.push({ tool: "메일 보내기", ok: true, output: `${input.to || "받는 사람"}에게 보냄`, auth });
                else if (c.name === "set_timer") {
                  const kind = input.repeat === "되풀이" ? "schedule" : "follow_up";
                  new_timers.push({ id: "t" + Date.now().toString(36), kind, note: String(input.note || "확인하기").slice(0, 120) });
                  results.push({ tool: "알림 예약", ok: true, output: (kind === "schedule" ? "반복 일정" : "후속 확인") + " 1건 예약", auth: "(필요 없음)" });
                } else results.push({ tool: c.name, ok: false, output: "프록시가 모르는 도구", auth: "(붙이지 않음)" });
              }
              console.log("붙인 자격증명:", auth);
              return { results, results_text: results.map((r) => `- ${r.tool}: ${r.output}`).join("\n"), new_timers, pending_next: {} };
            }
          outputs:
            results:
              type: array[object]
              children: null
            results_text:
              type: string
              children: null
            new_timers:
              type: array[object]
              children: null
            pending_next:
              type: object
              children: null
