app:
  name: 상시 실행 에이전트 (수신함 · 타이머 · 기억 · 권한 · 발신함)
  description: >-
    대부분 잠들어 있다가 이벤트가 오면 짧게 깨어나 일하고 다시 잠드는 에이전트의 기본 구조. Anthropic ‘Building
    always-on agents’(William Hu, 2026-11-13)의 다섯 요소를 블록 하나씩으로 옮겼습니다.
  icon: 🌙
  mode: advanced-chat
  icon_background: '#DBEAFE'
kind: app
version: 0.1.5
workflow:
  conversation_variables:
    - name: seen_events
      value: []
      value_type: array[string]
    - name: timers
      value: []
      value_type: array[object]
    - name: pending
      value: {}
      value_type: object
  environment_variables:
    - name: owner
      value: 김하늘
      value_type: string
    - name: policy
      value: '{"allow":["read_calendar","set_timer"],"ask":["send_email"],"deny":["pay","delete_files"]}'
      value_type: string
    - name: service_token
      value: demo-token-not-a-real-secret
      value_type: string
  features:
    opening_statement: >-
      메시지 한 번이 이벤트 하나입니다. 위 ‘이벤트 종류’를 바꿔 가며 보내 보세요. 메일은 승인을 기다리고(이벤트 종류를 ‘승인
      응답’으로 바꿔 ‘승인’), 결제는 차단되고, 알림은 ‘타이머’ 이벤트를 보내면 돌아옵니다. 같은 웹훅을 두 번 보내면 두 번째는
      조용히 끝납니다.
    suggested_questions:
      - 내일 일정 알려줘
      - 김대리에게 회의 자료 메일 보내줘
      - 거래처에 50만원 결제해줘
      - 30분 뒤에 답장 왔는지 확인하라고 알림 맞춰줘
      - '[GitHub] main 브랜치 CI 실패: test_login'
  graph:
    nodes:
      - id: start
        type: custom
        position:
          x: 0
          'y': 220
        data:
          type: start
          title: 이벤트 도착
          desc: 메시지 · 웹훅 · 타이머 · 승인 응답
          variables:
            - variable: event_type
              label: 이벤트 종류
              type: select
              options:
                - 사용자 메시지
                - 웹훅
                - 타이머
                - 승인 응답
              default: 사용자 메시지
              required: false
      - id: timer_block
        type: custom-block
        position:
          x: 290
          'y': 150
        width: 640
        height: 200
        data:
          type: block
          title: 2. 타이머
          desc: 후속 확인 · 반복 일정
          color: '#dbeafe'
      - id: timer_due
        type: custom
        parentId: timer_block
        position:
          x: 56
          'y': 74
        data:
          type: code
          title: 기한이 된 타이머 꺼내기
          desc: 스케줄러가 깨웠을 때만 일한다
          code_language: javascript
          variables:
            - variable: event_type
              value_selector:
                - start
                - event_type
            - variable: timers
              value_selector:
                - conversation
                - timers
          code: |-
            // 타이머는 수신함과 따로 보관한다. 수신함에는 "지금 할 일"만 들어간다.
            // 타이머가 직접 실행을 시작하지 않는다. 스케줄러가 기한이 된 것을 이벤트로 바꿔 수신함에 넣는다.
            // (데모: '타이머' 이벤트 한 번을 스케줄러의 한 바퀴로 보고, 그때 저장된 타이머를 모두 기한이 된 것으로 친다)
            function main({ event_type, timers }) {
              const list = Array.isArray(timers) ? timers : [];
              if (event_type !== "타이머") return { fired: [], remaining: list, fired_text: "" };
              // 후속 확인(follow-up)은 한 번 울리고 끝, 반복 일정(schedule)은 다음 회차를 위해 남긴다
              const remaining = list.filter((t) => t.kind === "schedule");
              console.log(`울린 타이머 ${list.length}개, 남은 반복 일정 ${remaining.length}개`);
              return { fired: list, remaining, fired_text: list.map((t) => `- [${t.kind === "schedule" ? "반복 일정" : "후속 확인"}] ${t.note}`).join("\n") };
            }
          outputs:
            fired:
              type: array[object]
              children: null
            remaining:
              type: array[object]
              children: null
            fired_text:
              type: string
              children: null
      - id: timer_keep
        type: custom
        parentId: timer_block
        position:
          x: 348
          'y': 74
        data:
          type: assigner
          title: 타이머 저장소 갱신
          desc: 울린 후속 확인은 지운다
          version: '2'
          items:
            - variable_selector:
                - conversation
                - timers
              input_type: variable
              operation: over-write
              value:
                - timer_due
                - remaining
      - id: inbox_block
        type: custom-block
        position:
          x: 990
          'y': 140
        width: 640
        height: 220
        data:
          type: block
          title: 1. Event Inbox
          desc: 유일한 진실 원천 · 워커는 하나
          color: '#dbeafe'
      - id: inbox_norm
        type: custom
        parentId: inbox_block
        position:
          x: 56
          'y': 84
        data:
          type: code
          title: 이벤트 정리
          desc: 묶기 · 중복 확인 · 갈 길 정하기
          code_language: javascript
          variables:
            - variable: text
              value_selector:
                - sys
                - query
            - variable: event_type
              value_selector:
                - start
                - event_type
            - variable: seen
              value_selector:
                - conversation
                - seen_events
            - variable: pending
              value_selector:
                - conversation
                - pending
            - variable: fired
              value_selector:
                - timer_due
                - fired
            - variable: fired_text
              value_selector:
                - timer_due
                - fired_text
          code: >-
            // 수신함이 유일한 진실 원천이다. 메시지·웹훅·타이머가 에이전트를 직접 부르지 않고 모두 여기를 거친다.

            function main({ text, event_type, seen, pending, fired, fired_text
            }) {
              const kind = event_type || "사용자 메시지";
              const body = String(text || "").trim();
              // 연속으로 온 메시지(줄바꿈)는 한 번의 실행으로 묶어, 답도 한 번만 한다
              const lines = body.split(/\n+/).map((l) => l.trim()).filter(Boolean);
              // 중복 제거는 출처가 준 ID 로 한다. 데모에서는 웹훅 본문을 ID 로 쓴다(웹훅은 같은 것이 다시 올 수 있다)
              let h = 0;
              for (const ch of kind + "|" + body) h = (h * 31 + ch.codePointAt(0)) >>> 0;
              const key = kind === "웹훅" ? "wh-" + h.toString(36) : "";

              if (kind === "승인 응답") {
                const has = pending && pending.tool;
                return { route: has ? "승인응답" : "조용히", kind, key, count: 1, events: body, reason: has ? "보류해 둔 도구 호출에 대한 답" : "기다리는 승인 요청이 없음" };
              }
              if (kind === "타이머") {
                const n = (fired || []).length;
                if (!n) return { route: "조용히", kind, key, count: 0, events: "", reason: "기한이 된 타이머가 없음" };
                return { route: "실행", kind, key, count: n, events: "타이머: 예약해 둔 확인 시각이 됐다\n" + fired_text, reason: `타이머 ${n}개가 이벤트로 들어옴` };
              }
              if (key && (seen || []).includes(key)) return { route: "조용히", kind, key, count: lines.length, events: body, reason: "이미 처리한 웹훅(중복)" };
              const label = kind === "웹훅" ? "웹훅" : "사용자";
              return {
                route: "실행",
                kind,
                key,
                count: lines.length,
                events: lines.map((l) => `${label}: ${l}`).join("\n"),
                reason: lines.length > 1 ? `연속 메시지 ${lines.length}건을 한 번의 실행으로 묶음` : "새 이벤트",
              };
            }
          outputs:
            route:
              type: string
              children: null
            kind:
              type: string
              children: null
            key:
              type: string
              children: null
            count:
              type: number
              children: null
            events:
              type: string
              children: null
            reason:
              type: string
              children: null
      - id: inbox_mark
        type: custom
        parentId: inbox_block
        position:
          x: 348
          'y': 84
        data:
          type: assigner
          title: 처리 표시
          desc: 같은 웹훅이 다시 오면 건너뛴다
          version: '2'
          items:
            - variable_selector:
                - conversation
                - seen_events
              input_type: variable
              operation: append
              value:
                - inbox_norm
                - key
      - id: route
        type: custom
        position:
          x: 1690
          'y': 190
        data:
          type: switch
          title: 깨울까?
          desc: 수신함이 정한 길
          mode: text
          input:
            - inbox_norm
            - route
          case_sensitive: false
          branches:
            - id: run
              name: 실행
              operator: contains_any
              keywords:
                - 실행
              description: ''
            - id: approval
              name: 승인 응답
              operator: contains_any
              keywords:
                - 승인응답
              description: ''
          else_name: 깨울 일 없음
          code_language: javascript
          code: ''
          variables: []
          instruction: ''
      - id: run_block
        type: custom-block
        position:
          x: 1990
          'y': 0
        width: 360
        height: 230
        data:
          type: block
          title: 실행 (run)
          desc: 이벤트를 받아 일하고 저장하는 한 번의 작업
          color: '#fef3c7'
      - id: run_llm
        type: custom
        parentId: run_block
        position:
          x: 62
          'y': 74
        data:
          type: llm
          title: 에이전트 실행
          model:
            provider: anthropic
            name: claude-opus-5-5
            mode: chat
            completion_params:
              max_tokens: 16000
              effort: medium
              thinking_display: summarized
          prompt_template:
            - role: system
              text: >-
                너는 {{#env.owner#}}의 상시 실행 개인 비서다. 사용자가 지켜보지 않는 동안 이벤트가 올 때마다 짧게
                깨어나 일하고 다시 잠든다.


                [한 번의 실행에서 할 일]

                1. 기억을 읽는다. /memories 의 MEMORY.md(색인), instructions.md(사용자 지시),
                reported.md(이미 보고한 것)는 매번 본다. notes/ 와 progress/ 는 필요할 때만 연다.

                2. 이벤트를 처리한다. 확인하거나 실행할 일은 도구로 요청한다. 도구는 바로 실행되지 않고 권한 확인을 거친다.
                비밀번호나 토큰은 네가 다루지 않는다.

                3. 다시 찾을 수 없는 것만 기억에 적는다. 다른 시스템에 있는 정보는 위치만 적는다. 보고한 내용은
                reported.md 에 한 줄 남긴다.


                [보고]

                결과와 핵심만 2~3문장으로 쓴다. 과정은 쓰지 않는다. 사용자가 알 필요가 없는 일이면 정확히 "보낼 것
                없음"이라고만 답한다. 이미 보고한 내용은 다시 보내지 않는다.
            - role: user
              text: |-
                [들어온 이벤트 · {{#inbox_norm.kind#}} · {{#inbox_norm.count#}}건]
                {{#inbox_norm.events#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          desc: 기억 읽기 → 행동 → 기억 갱신
          tools:
            enabled: true
            max_steps: 6
            builtin:
              - current_time
            custom:
              - name: read_calendar
                description: 일정 조회. 사용자의 캘린더에서 하루 일정을 읽는다.
                parameters: |-
                  {
                    "type": "object",
                    "properties": {
                      "day": {
                        "type": "string",
                        "description": "조회할 날 (예: 오늘, 내일, 2026-11-20)"
                      }
                    },
                    "required": [
                      "day"
                    ]
                  }
                code: >-
                  // 이 도구는 바로 실행하지 않는다. "하고 싶은 일"만 기록해 두면 '4. 권한' 블록이 판정하고, 통과한
                  것만 프록시가 실행한다.

                  function main(input) {
                    return { status: "보류됨", note: "읽기 전용이라 정책상 바로 진행됩니다." };
                  }
              - name: set_timer
                description: >-
                  알림 예약. 나중에 다시 확인할 일을 타이머로 맡긴다. 사용자가 '알림', '나중에 확인', '매일'처럼 말할
                  때 쓴다.
                parameters: |-
                  {
                    "type": "object",
                    "properties": {
                      "note": {
                        "type": "string",
                        "description": "그때 확인할 내용"
                      },
                      "repeat": {
                        "type": "string",
                        "enum": [
                          "한 번",
                          "되풀이"
                        ],
                        "description": "한 번 확인하고 끝이면 한 번, 매일·매주처럼 이어지면 되풀이"
                      }
                    },
                    "required": [
                      "note"
                    ]
                  }
                code: >-
                  // 이 도구는 바로 실행하지 않는다. "하고 싶은 일"만 기록해 두면 '4. 권한' 블록이 판정하고, 통과한
                  것만 프록시가 실행한다.

                  function main(input) {
                    return { status: "보류됨", note: "타이머 저장소에만 적으므로 바로 진행됩니다." };
                  }
              - name: send_email
                description: 메일 보내기. 사용자 이름으로 메일을 보낸다.
                parameters: |-
                  {
                    "type": "object",
                    "properties": {
                      "to": {
                        "type": "string",
                        "description": "받는 사람"
                      },
                      "body": {
                        "type": "string",
                        "description": "보낼 내용"
                      }
                    },
                    "required": [
                      "to",
                      "body"
                    ]
                  }
                code: >-
                  // 이 도구는 바로 실행하지 않는다. "하고 싶은 일"만 기록해 두면 '4. 권한' 블록이 판정하고, 통과한
                  것만 프록시가 실행한다.

                  function main(input) {
                    return { status: "보류됨", note: "밖으로 나가는 행동이라 사용자 승인이 필요합니다." };
                  }
              - name: pay
                description: 결제. 사용자의 카드나 계좌로 돈을 보낸다.
                parameters: |-
                  {
                    "type": "object",
                    "properties": {
                      "to": {
                        "type": "string",
                        "description": "받는 곳"
                      },
                      "amount": {
                        "type": "string",
                        "description": "금액"
                      }
                    },
                    "required": [
                      "to",
                      "amount"
                    ]
                  }
                code: >-
                  // 이 도구는 바로 실행하지 않는다. "하고 싶은 일"만 기록해 두면 '4. 권한' 블록이 판정하고, 통과한
                  것만 프록시가 실행한다.

                  function main(input) {
                    return { status: "보류됨", note: "정책상 금지된 행동입니다." };
                  }
              - name: delete_files
                description: 삭제. 사용자의 드라이브에서 파일을 지운다.
                parameters: |-
                  {
                    "type": "object",
                    "properties": {
                      "path": {
                        "type": "string",
                        "description": "지울 경로"
                      }
                    },
                    "required": [
                      "path"
                    ]
                  }
                code: >-
                  // 이 도구는 바로 실행하지 않는다. "하고 싶은 일"만 기록해 두면 '4. 권한' 블록이 판정하고, 통과한
                  것만 프록시가 실행한다.

                  function main(input) {
                    return { status: "보류됨", note: "정책상 금지된 행동입니다." };
                  }
            skills: []
            mcp: []
      - id: perm_block
        type: custom-block
        position:
          x: 2420
          'y': 90
        width: 1300
        height: 400
        data:
          type: block
          title: 4. 권한
          desc: 진행 · 차단 · 승인 대기
          color: '#dbeafe'
      - id: perm_check
        type: custom
        parentId: perm_block
        position:
          x: 56
          'y': 150
        data:
          type: code
          title: 정책 판정
          desc: 도구 호출마다 진행 · 차단 · 승인 대기
          code_language: javascript
          variables:
            - variable: route
              value_selector:
                - inbox_norm
                - route
            - variable: answer
              value_selector:
                - sys
                - query
            - variable: calls
              value_selector:
                - run_llm
                - tool_calls
            - variable: pending
              value_selector:
                - conversation
                - pending
            - variable: policy
              value_selector:
                - env
                - policy
          code: >-
            // 실행(run)은 사용자의 권한을 들고 혼자 돈다. 그래서 모델이 고른 도구 호출을 그대로 실행하지 않고 여기서 한 번
            거른다.

            const LABEL = {"read_calendar":"일정 조회","set_timer":"알림
            예약","send_email":"메일 보내기","pay":"결제","delete_files":"파일
            삭제","memory":"메모리"};

            function main({ route, answer, calls, pending, policy }) {
              const rule = JSON.parse(policy || "{}");
              const name = (c) => LABEL[c.name] || c.name;

              // 승인 응답: 새 판정이 아니라, 보류해 둔 호출을 이어서 처리한다
              if (route === "승인응답") {
                const ok = /승인|허용|yes|ok|네|예|좋아/i.test(answer || "") && !/거절|거부|아니|no/i.test(answer || "");
                return ok
                  ? { decision: "진행", allowed: [pending], blocked: [], deferred: {}, summary: `사용자가 승인함 → ${name(pending)} 실행` }
                  : { decision: "차단", allowed: [], blocked: [{ ...pending, why: "사용자가 거절함" }], deferred: {}, summary: `사용자가 거절함 → ${name(pending)} 취소` };
              }

              const list = (Array.isArray(calls) ? calls : []).filter((c) => c.name !== "memory"); // 메모리 도구는 자기 저장소만 건드린다
              const allowed = [];
              const blocked = [];
              let deferred = {};
              for (const c of list) {
                if ((rule.deny || []).includes(c.name)) blocked.push({ name: c.name, input: c.input, why: "정책상 금지된 행동" });
                else if ((rule.ask || []).includes(c.name)) {
                  if (!deferred.tool) deferred = { tool: c.name, name: c.name, input: c.input };
                } else if ((rule.allow || []).includes(c.name)) allowed.push({ name: c.name, input: c.input });
                else blocked.push({ name: c.name, input: c.input, why: "허용 목록에 없는 도구" });
              }
              const decision = deferred.tool ? "승인 대기" : blocked.length && !allowed.length ? "차단" : "진행";
              const parts = [
                allowed.length ? "진행: " + allowed.map(name).join(", ") : "",
                blocked.length ? "차단: " + blocked.map(name).join(", ") : "",
                deferred.tool ? "승인 대기: " + name(deferred) : "",
              ].filter(Boolean);
              return { decision, allowed, blocked, deferred, summary: parts.join(" / ") || "도구 호출 없음" };
            }
          outputs:
            decision:
              type: string
              children: null
            allowed:
              type: array[object]
              children: null
            blocked:
              type: array[object]
              children: null
            deferred:
              type: object
              children: null
            summary:
              type: string
              children: null
