      - id: outbox_block
        type: custom-block
        position:
          x: 3790
          'y': 70
        width: 1000
        height: 440
        data:
          type: block
          title: 5. Event Outbox
          desc: 결과와 핵심만 전달
          color: '#dbeafe'
      - id: outbox_build
        type: custom
        parentId: outbox_block
        position:
          x: 56
          'y': 176
        data:
          type: code
          title: 보낼 내용 정하기
          desc: 전달 · 보낼 것 없음 · 승인 요청
          code_language: javascript
          variables:
            - variable: route
              value_selector:
                - inbox_norm
                - route
            - variable: reason
              value_selector:
                - inbox_norm
                - reason
            - variable: decision
              value_selector:
                - perm_check
                - decision
            - variable: deferred
              value_selector:
                - perm_check
                - deferred
            - variable: blocked
              value_selector:
                - perm_check
                - blocked
            - variable: results_text
              value_selector:
                - proxy
                - results_text
            - variable: draft
              value_selector:
                - run_llm
                - text
          code: >-
            // 백그라운드 에이전트는 일하는 과정을 흘려보내지 않는다. 결과와 핵심만 보낸다.

            // 실행은 셋 중 하나로 끝난다: 메시지를 보낸다 / 아무것도 보내지 않는다 / 승인을 요청하며 도구 호출을 보류한다.

            const LABEL = {"read_calendar":"일정 조회","set_timer":"알림
            예약","send_email":"메일 보내기","pay":"결제","delete_files":"파일
            삭제","memory":"메모리"};

            function main({ route, reason, decision, deferred, blocked,
            results_text, draft }) {
              if (route === "조용히") return { kind: "보낼 것 없음", message: reason || "" };
              if (decision === "승인 대기" && deferred && deferred.tool) {
                const args = Object.entries(deferred.input || {}).map(([k, v]) => `  - ${k}: ${String(v).slice(0, 80)}`).join("\n");
                return { kind: "승인 요청", message: `**${LABEL[deferred.tool] || deferred.tool}** 을(를) 실행해도 될까요?\n${args}` };
              }
              const lines = [];
              const text = String(draft || "").trim();
              // Mock 모드의 자리 채움 응답은 보고가 아니므로 뺀다
              if (text && !/^보낼 것 없음/.test(text) && !text.startsWith("【Mock")) lines.push(text);
              if (results_text) lines.push("**한 일**\n" + results_text);
              if (blocked && blocked.length) lines.push("**하지 않은 일**\n" + blocked.map((b) => `- ${LABEL[b.name] || b.name}: ${b.why}`).join("\n"));
              if (!lines.length) return { kind: "보낼 것 없음", message: "알릴 만한 결과가 없음" };
              return { kind: "전달", message: lines.join("\n\n") };
            }
          outputs:
            kind:
              type: string
              children: null
            message:
              type: string
              children: null
